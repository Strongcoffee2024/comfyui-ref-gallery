<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参考图库 · Ref Gallery</title>
<link rel="stylesheet" href="/extensions/comfyui-ref-gallery/gallery.css">
</head>
<body>
<header class="topbar">
  <div class="brand">参考图库 <span>Ref Gallery</span></div>
  <div class="tools">
    <input id="search" type="search" placeholder="搜索名称 / 分类 / 标签 / ID" aria-label="搜索">
    <select id="filter" aria-label="分类筛选"><option value="all">全部分类</option></select>
    <button id="btn-upload" type="button">＋ 上传图片</button>
    <button id="btn-import" type="button">从文件夹导入</button>
    <button id="btn-delete" type="button" class="danger" hidden>删除选中</button>
    <button id="btn-select" type="button">使用选中图片</button>
    <button id="btn-close" type="button">关闭</button>
  </div>
</header>
<main>
  <p id="status" class="status" role="status">正在读取图库…</p>
  <div id="grid" class="grid"></div>
</main>

<dialog id="upload-dialog" aria-labelledby="upload-title">
  <form id="upload-form" novalidate>
    <h2 id="upload-title">上传图片到图库</h2>
    <p class="hint">仅导入图片本体：不抠图、不去背景、不修改人物。静态 PNG / JPEG / WebP，≤20 MiB、≤3200 万像素。</p>
    <div class="row">
      <button id="pick-file" type="button">选择图片</button>
      <span id="file-name">尚未选择</span>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    </div>
    <img id="upload-preview" alt="预览" hidden>
    <label>名称（必填）<input id="f-name" maxlength="120" required></label>
    <label>英文名称（可选）<input id="f-other" maxlength="120"></label>
    <label>分类（可选）<input id="f-category" maxlength="120" placeholder="未分类"></label>
    <label>视角（可选）
      <select id="f-angle">
        <option value="unknown">未分类</option>
        <option value="front">正面</option>
        <option value="top">俯视</option>
        <option value="bottom">仰视</option>
        <option value="side">侧面</option>
        <option value="diagonal">斜侧</option>
      </select>
    </label>
    <label>标签（可选，逗号分隔）<input id="f-tags" maxlength="240"></label>
    <p id="upload-error" class="error" role="alert" hidden></p>
    <div class="actions">
      <button id="upload-cancel" type="button">取消</button>
      <button id="upload-save" type="submit" disabled>保存到图库</button>
    </div>
  </form>
</dialog>

<dialog id="import-dialog" aria-labelledby="import-title">
  <form id="import-form" novalidate>
    <h2 id="import-title">从本地文件夹批量导入</h2>
    <p class="hint">填入 ComfyUI 所在机器上可访问的文件夹绝对路径。仅导入该目录内的静态图片，不递归子目录。</p>
    <label>文件夹路径<input id="import-folder" required placeholder="例如 D:\refs\poses"></label>
    <label>归类到（可选）<input id="import-category" maxlength="120" placeholder="未分类"></label>
    <p id="import-result" class="hint" role="status"></p>
    <p id="import-error" class="error" role="alert" hidden></p>
    <div class="actions">
      <button id="import-cancel" type="button">取消</button>
      <button id="import-save" type="submit">导入</button>
    </div>
  </form>
</dialog>

<script type="module" src="/extensions/comfyui-ref-gallery/gallery.js"></script>
</body>
</html>
